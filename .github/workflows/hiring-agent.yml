name: Hiring Agent

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run hiring agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAREERPLUG_EMAIL: ${{ secrets.CAREERPLUG_EMAIL }}
          CAREERPLUG_PASSWORD: ${{ secrets.CAREERPLUG_PASSWORD }}
          CAREERPLUG_COMPANY_SLUG: ${{ secrets.CAREERPLUG_COMPANY_SLUG }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_USER_EMAIL: ${{ secrets.GRAPH_USER_EMAIL }}
          EMAIL_TRIGGER_SUBJECT: ${{ secrets.EMAIL_TRIGGER_SUBJECT }}
          CALENDLY_LINK: ${{ secrets.CALENDLY_LINK }}
          CALENDLY_LINK_1HR: ${{ secrets.CALENDLY_LINK_1HR }}
          SCORE_NOTIFY_THRESHOLD: ${{ secrets.SCORE_NOTIFY_THRESHOLD }}
        run: python main.py

      - name: Run follow-up agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAREERPLUG_EMAIL: ${{ secrets.CAREERPLUG_EMAIL }}
          CAREERPLUG_PASSWORD: ${{ secrets.CAREERPLUG_PASSWORD }}
          CAREERPLUG_COMPANY_SLUG: ${{ secrets.CAREERPLUG_COMPANY_SLUG }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_USER_EMAIL: ${{ secrets.GRAPH_USER_EMAIL }}
          CALENDLY_LINK: ${{ secrets.CALENDLY_LINK }}
          MANAGER_PHONE: ${{ secrets.MANAGER_PHONE }}
        run: python follow_up.py

      - name: Run scheduling agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAREERPLUG_EMAIL: ${{ secrets.CAREERPLUG_EMAIL }}
          CAREERPLUG_PASSWORD: ${{ secrets.CAREERPLUG_PASSWORD }}
          CAREERPLUG_COMPANY_SLUG: ${{ secrets.CAREERPLUG_COMPANY_SLUG }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_USER_EMAIL: ${{ secrets.GRAPH_USER_EMAIL }}
          CALENDLY_LINK: ${{ secrets.CALENDLY_LINK }}
          CLUBREADY_USERNAME: ${{ secrets.CLUBREADY_USERNAME }}
          CLUBREADY_PASSWORD: ${{ secrets.CLUBREADY_PASSWORD }}
        run: python schedule_interviews.py
